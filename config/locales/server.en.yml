en:
  site_settings:
    club_teams_enabled: "Keep a topic updated with results and fixtures for the club's other teams."
    club_teams_api_key: "API key, for providers that need one. ESPN does not; API-Football does, and its free plan cannot serve the current season."
    club_teams_teams: "One team per comma, as Label|provider|team_id|league;league — e.g. Femenino|espn|21424|esp.w.1;esp.copa_de_la_reina. Providers: espn, api_football. Leagues are only used by espn. Find ids with script/find_teams.rb."
    club_teams_topic_id: "Topic ID the summary post lives in. Required."
    club_teams_heading: "Heading at the top of the post."
    club_teams_recent_count: "How many recent results to show per team."
    club_teams_upcoming_count: "How many upcoming fixtures to show per team. 0 hides the section."
    club_teams_back_days: "How far back to look for results."
    club_teams_forward_days: "How far ahead to look for fixtures."
    club_teams_timezone: "Timezone for kickoff times, e.g. Europe/Madrid."
