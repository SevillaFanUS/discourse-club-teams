en:
  site_settings:
    club_teams_enabled: "Enable the other-teams results topic."
    club_teams_api_key: "API-Football key from api-sports.io. The free tier allows 100 requests a day; this plugin uses one per team per run."
    club_teams_teams: "Comma-separated Label:team_id pairs, e.g. 'Femenino:1234,Sevilla Atlético:5678'. Run script/find_teams.rb to look up ids."
    club_teams_topic_id: "Topic the results post lives in. Required — nothing is posted until this is set."
    club_teams_season: "Season start year, e.g. 2026. Leave blank to detect automatically."
    club_teams_recent_count: "How many recent results to show per team."
    club_teams_upcoming_count: "How many upcoming fixtures to show per team. Set to 0 to show results only."
    club_teams_timezone: "Timezone for kickoff times."
